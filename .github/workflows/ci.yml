name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyarrow vaderSentiment nltk

      - name: Fetch stock data
        run: python src/ingest.py

      - name: Run feature engineering (CI mode)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/ci_features.py

      - name: Build model index
        run: python scripts/build_model_index.py

      - name: Upgrade MLflow DB schema
        run: mlflow db upgrade sqlite:///mlflow.db

      - name: Train models & log to MLflow
        env:
          CI: "true"
        run: python src/train.py --features data/processed/features.csv

      - name: Test API health
        run: |
          cd src && python serve.py &
          sleep 30
          curl -f http://localhost:8000/health

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t indonesian-stock-mlops:latest .